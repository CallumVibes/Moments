name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fails if index.html was hand-edited or is stale relative to src/,
      # if any inline script is invalid JS, or if the CSP no longer pins it.
      - run: npm run check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # Spins up two OPRF servers itself, so PIN enrollment and recovery are
      # exercised against real HTTP and real rate limiting.
      - run: npm run test:e2e
